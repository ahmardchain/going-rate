name = "going-rate"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

# No id: wrangler 4 creates the KV namespace automatically on the first deploy
# and reuses it afterwards. To pin an existing namespace, add id = "<namespace id>".
[[kv_namespaces]]
binding = "GOING_RATE"

# Secrets (never commit). Set in the Cloudflare dashboard (Worker > Settings >
# Variables and Secrets) or with:
#   npx wrangler secret put SERV_API_KEY
#   npx wrangler secret put INGEST_TOKEN   (optional, for verified Kite outcomes)
